# Mosquitto for esp-ota devices (PLAN §8).
#
# TLS only, authenticated only, on the LAN only. Nothing here is exposed to the internet
# and nothing here should be: the router is what keeps 8883 private, exactly as it keeps
# nginx's 8443 private.
#
# The device trusts the same private CA it uses for OTA (PLAN §3), which is the whole
# reason this is cheap to add -- there is no second trust anchor to manage, and re-issuing
# the server certificate does not touch firmware.

per_listener_settings true

listener 8883
protocol mqtt

# --- TLS -------------------------------------------------------------------
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key

tls_version tlsv1.2
# Not require_certificate: devices authenticate with a username and password, not with a
# client certificate. Per-device client certs would be better and are a real option later,
# but they mean a certificate to issue, ship and rotate per board -- and the thing this
# broker controls is "check for an update", not the update itself, which is signed.
require_certificate false

# --- Authentication --------------------------------------------------------
# Anonymous access would let anyone on the LAN publish commands to every device. The web
# UI is already an unauthenticated control surface (PLAN §7) and that is a considered
# trade for something you have to be able to reach; a broker is not that.
allow_anonymous false
password_file /mosquitto/config/passwd

# --- Persistence and logging ----------------------------------------------
# Retained messages survive a restart, which matters: a device's last status and its
# online/offline state are published retained, so a dashboard that connects later still
# sees the fleet rather than an empty topic tree.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
