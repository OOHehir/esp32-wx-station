# nginx configuration for serving ESP-IDF OTA images over TLS.
#
# Tuned for esp_https_ota / mbedTLS clients rather than browsers: no HTTP/2 (the
# ESP HTTP client is 1.1), a conservative cipher list, and keepalive long enough
# that a slow device on poor Wi-Fi does not get cut off mid-image.

worker_processes 1;

events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile      on;
    tcp_nopush    on;

    # Log bytes_sent and request_time: the two numbers you want when an OTA
    # mysteriously stops at 43%.
    log_format ota '$remote_addr $status $body_bytes_sent/$content_length '
                   '${request_time}s "$request" range="$http_range" "$http_user_agent"';
    access_log /dev/stdout ota;
    error_log  /dev/stderr warn;

    # A 2 MB image over marginal Wi-Fi can take a while.
    keepalive_timeout 120s;
    send_timeout      120s;

    server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # TLS 1.2 is the floor. ESP-IDF supports 1.3, but leaving 1.2 enabled
        # avoids surprises on older IDF branches or trimmed mbedTLS configs.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:AES128-GCM-SHA256;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:2m;
        ssl_session_timeout 1h;

        # Read-only file server. Nothing here should ever accept an upload.
        # limit_except is only valid inside a location block, so guard the whole
        # server on the request method instead.
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        root /srv/firmware;

        location /fw/ {
            alias /srv/firmware/;
            autoindex on;                 # handy when poking around with curl
            add_header Cache-Control "public, max-age=300";

            # Manifests must never be cached: they are how a device learns a new
            # version exists.
            location ~ /manifest\.json$ {
                add_header Cache-Control "no-store";
                default_type application/json;
            }
        }

        # Cheap liveness probe for scripts and for the device's "is the server up"
        # check before it commits to a download.
        location = /healthz {
            return 200 "ok\n";
            default_type text/plain;
        }

        location / {
            return 404;
        }
    }
}
